name: Deploy Sistur (Multi-Environment)

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Usando caminhos absolutos para evitar erros de interpretação do terminal
            if [ "${{ github.ref_name }}" = "main" ]; then
              TARGET_DIR="/root/apps/sistur-python"
              BRANCH="main"
            else
              TARGET_DIR="/root/apps/sistur-teste"
              BRANCH="develop"
            fi

            echo "🚀 Iniciando deploy na branch $BRANCH para o diretório $TARGET_DIR"
            
            # O '|| exit 1' impede que o script continue se a pasta não for encontrada
            cd $TARGET_DIR || { echo "❌ Erro: Pasta $TARGET_DIR não encontrada!"; exit 1; }
            
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH
            
            docker compose up -d --build
