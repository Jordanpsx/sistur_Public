<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ titulo }}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0fdfa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    .error-container {
      background: var(--c-surface);
      border-radius: 16px;
      padding: 2rem;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    .error-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f766e;
      margin: 0 0 0.5rem 0;
    }

    .error-message {
      color: #64748b;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }

    .btn-back {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #0d9488;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .btn-back:hover {
      background: #0f766e;
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-icon" style="color:#dc2626"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.125em" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <h1 class="error-title">{{ titulo }}</h1>
    <p class="error-message">{{ mensagem }}</p>
    <a href="{{ url_for('reservas.index') }}" class="btn-back">
      Voltar ao Dashboard
    </a>
  </div>
</body>

</html>
